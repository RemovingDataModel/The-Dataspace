<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Minimal Site</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background Video (Muted so it auto-plays) -->
    <video autoplay loop muted playsinline id="bg-video">
        <source src="DataMindscape.mp4" type="video/mp4">
    </video>

    <!-- Background Music -->
    <audio id="bg-audio" loop>
        <source src="Idle.mp3" type="audio/mpeg">
    </audio>

    <!-- Click Overlay (Required to bypass browser autoplay blocks) -->
    <div id="overlay" onclick="startSite()">
        <button>ENTER</button>
    </div>

    <script>
        function startSite() {
            // Play the music
            document.getElementById('bg-audio').play();
            // Hide the overlay button
            document.getElementById('overlay').style.display = 'none';
        }
    </script>

</body>
</html>
